<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - TV Masjid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      text-align: center;
    }
    
    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      background: #e0e7ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }
    
    h1 {
      font-size: 28px;
      color: #1f2937;
      margin-bottom: 10px;
    }
    
    p {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    .status {
      background: #fef3c7;
      border: 1px solid #fbe69e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      color: #92400e;
      font-size: 14px;
    }
    
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    
    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .primary {
      background: #667eea;
      color: white;
    }
    
    .primary:hover {
      background: #5a67d8;
    }
    
    .secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    
    .secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    
    <h1>You're Offline</h1>
    
    <p>
      It looks like you've lost your internet connection. 
      Some features of TV Masjid are available offline.
    </p>
    
    <div class="status">
      <strong>Available Offline:</strong> Prayer times, Khotib schedule, Announcements, Grafik
    </div>
    
    <p style="font-size: 14px; color: #9ca3af;">
      Try connecting to the internet to access dynamic content and admin features.
    </p>
    
    <div class="actions">
      <button class="secondary" onclick="window.history.back()">Go Back</button>
      <button class="primary" onclick="reloadPage()">Retry</button>
    </div>
  </div>
  
  <script>
    function reloadPage() {
      window.location.reload();
    }
    
    // Periodically check for connection
    window.addEventListener('online', () => {
      document.location.reload();
    });
  </script>
</body>
</html>
